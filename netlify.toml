[build]
  command = "cd lead-leak-audit && npm ci && npm run build && rm -rf ../audit && mv dist ../audit"
  publish = "."

[[redirects]]
  from = "/api/consent"
  to = "/.netlify/functions/consent"
  status = 200

[[redirects]]
  from = "/landing"
  to = "/welcome"
  status = 301

[[redirects]]
  from = "/landing.html"
  to = "/welcome"
  status = 301

[[redirects]]
  from = "/audit"
  to = "/audit/"
  status = 301

[[redirects]]
  from = "/audit/*"
  to = "/audit/index.html"
  status = 200

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
